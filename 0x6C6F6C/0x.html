<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja YouTube Selector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border-bottom: 1px solid #333;
            position: relative;
        }
        h1 {
            font-size: 2.5rem;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
            margin-bottom: 10px;
        }
        .tagline {
            font-size: 1rem;
            color: #aaa;
        }
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        #search-input {
            width: 70%;
            padding: 15px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            background-color: #222;
            color: #fff;
        }
        button {
            background-color: #ffcc00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #ffdd33;
            transform: scale(1.05);
        }
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .channel-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
        }
        .channel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
        .channel-thumbnail {
            height: 150px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ffcc00;
        }
        .channel-info {
            padding: 15px;
        }
        .channel-title {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        .channel-description {
            font-size: 0.9rem;
            color: #aaa;
        }
        .blade {
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background-color: transparent;
            border-left: 2px solid #ffcc00;
            transform: rotate(5deg);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
            z-index: -1;
        }
        .chakra {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #ffcc00;
            box-shadow: 0 0 10px #ffcc00;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="blade"></div>
    <div class="chakra"></div>
    <div class="container">
        <header>
            <h1>NinjaTube Selector</h1>
            <p class="tagline">Zero visibility, infinite content</p>
        </header>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for channels or videos...">
            <button onclick="searchChannels()">Search</button>
        </div>
        <div class="channel-grid" id="channel-grid">
            <!-- Channel cards will be inserted here -->
        </div>
    </div>
    <script>
        // Sample data for demonstration
        const channels = [
            {
                id: 1,
                name: "Coding Ninjas",
                description: "Learn web development, algorithms, and more. Zero to hero.",
                thumbnail: "👨‍💻"
            },
            {
                id: 2,
                name: "Ninja WebOps",
                description: "Web operations, penetration testing, and infrastructure security.",
                thumbnail: "🌐"
            },
            {
                id: 3,
                name: "ShadowBlade Gaming",
                description: "Gaming walkthroughs, strategy guides, and tactical analysis.",
                thumbnail: "🎮"
            },
            {
                id: 4,
                name: "Zero-Day Intel",
                description: "Latest cybersecurity threats, digital forensics, and incident response.",
                thumbnail: "🔒"
            },
            {
                id: 5,
                name: "Ninja Code",
                description: "Clean code practices, refactoring, and software craftsmanship.",
                thumbnail: "[TOOL]"
            },
            {
                id: 6,
                name: "Web Ninja Academy",
                description: "Master the art of web development with practical projects.",
                thumbnail: "🎓"
            }
        ];

        // Function to display channel cards
        function displayChannels(channelsToShow) {
            const channelGrid = document.getElementById('channel-grid');
            channelGrid.innerHTML = '';
            
            channelsToShow.forEach(channel => {
                const channelCard = document.createElement('div');
                channelCard.className = 'channel-card';
                channelCard.innerHTML = `
                    <div class="channel-thumbnail">${channel.thumbnail}</div>
                    <div class="channel-info">
                        <h3 class="channel-title">${channel.name}</h3>
                        <p class="channel-description">${channel.description}</p>
                    </div>
                `;
                channelGrid.appendChild(channelCard);
            });
        }

        // Function to search channels
        function searchChannels() {
            const query = document.getElementById('search-input').value.toLowerCase();
            if (!query) {
                displayChannels(channels);
                return;
            }
            
            const filteredChannels = channels.filter(channel => 
                channel.name.toLowerCase().includes(query) || 
                channel.description.toLowerCase().includes(query)
            );
            
            displayChannels(filteredChannels);
        }

        // Initial display
        displayChannels(channels);
    </script>
</body>
</html>
