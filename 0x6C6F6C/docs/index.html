<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation | 0x6C6F6C</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0a0a;
            --tactical: #141414;
            --surface: #1f1f1f;
            --signal: #f5f5f5;
            --ghost: #666666;
            --maroon: #800000;
            --bright-maroon: #a50000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--void);
            color: var(--signal);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(165, 0, 0, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(165, 0, 0, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        header {
            position: fixed;
            top: 0; width: 100%; z-index: 50;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--surface);
            padding: 1rem 2rem;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            color: var(--bright-maroon);
            text-decoration: none;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            background: var(--tactical);
            border: 1px solid var(--surface);
            color: var(--signal);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--bright-maroon);
        }

        .search-input::placeholder { color: var(--ghost); }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ghost);
            font-size: 0.9rem;
        }

        .search-results {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: var(--tactical);
            border: 1px solid var(--surface);
            border-top: none;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 100;
        }

        .search-results.active { display: block; }

        .search-result-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--surface);
            cursor: pointer;
            transition: background 0.15s;
        }

        .search-result-item:hover { background: rgba(165, 0, 0, 0.1); }

        .search-result-title {
            font-size: 0.8rem;
            color: var(--signal);
            margin-bottom: 0.2rem;
        }

        .search-result-meta {
            font-size: 0.65rem;
            color: var(--ghost);
            text-transform: uppercase;
        }

        .nav {
            display: flex;
            gap: 1.5rem;
        }

        .nav a {
            color: var(--ghost);
            text-decoration: none;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .nav a:hover { color: var(--bright-maroon); }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 6rem 2rem 4rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem;
            letter-spacing: 4px;
            margin-bottom: 1rem;
        }

        .page-desc {
            color: var(--ghost);
            font-size: 0.9rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 4rem;
        }

        .stat-card {
            background: var(--tactical);
            border: 1px solid var(--surface);
            padding: 1.5rem;
            text-align: center;
            transition: all 0.2s;
        }

        .stat-card:hover {
            border-color: var(--bright-maroon);
            transform: translateY(-2px);
        }

        .stat-number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: var(--bright-maroon);
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--ghost);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sections-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .section-card {
            background: var(--tactical);
            border: 1px solid var(--surface);
            padding: 2rem;
            transition: all 0.2s;
        }

        .section-card:hover {
            border-color: var(--bright-maroon);
            transform: translateY(-2px);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--surface);
        }

        .section-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .section-count {
            font-size: 0.7rem;
            color: var(--bright-maroon);
            background: rgba(165, 0, 0, 0.1);
            padding: 0.2rem 0.6rem;
        }

        .section-desc {
            font-size: 0.8rem;
            color: var(--ghost);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .section-docs { list-style: none; }
        .section-docs li { margin-bottom: 0.5rem; }

        .section-docs a {
            color: var(--signal);
            text-decoration: none;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0;
            transition: all 0.15s;
        }

        .section-docs a:hover {
            color: var(--bright-maroon);
            padding-left: 0.5rem;
        }

        .doc-tag {
            font-size: 0.6rem;
            color: var(--ghost);
            text-transform: uppercase;
        }

        .view-all {
            display: block;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--surface);
            color: var(--bright-maroon);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            transition: all 0.2s;
        }

        .view-all:hover { background: rgba(165, 0, 0, 0.1); }

        footer {
            max-width: 1200px;
            margin: 4rem auto 0;
            padding: 2rem;
            border-top: 1px solid var(--surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-sigil {
            font-size: 1.2rem;
            color: var(--bright-maroon);
        }

        .footer-text {
            font-size: 0.7rem;
            color: var(--ghost);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 1024px) {
            .sections-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .header-content { flex-wrap: wrap; }
            .search-container {
                order: 3;
                max-width: 100%;
                flex-basis: 100%;
                margin-top: 0.5rem;
            }
            .nav { display: none; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .sections-grid { grid-template-columns: 1fr; }
            .page-title { font-size: 2.5rem; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--void); }
        ::-webkit-scrollbar-thumb { background: var(--surface); }
        ::-webkit-scrollbar-thumb:hover { background: var(--bright-maroon); }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/0x6C6F6C/" class="logo">Agents</a>
            <div class="search-container">
                <span class="search-icon">/</span>
                <input type="text" class="search-input" id="searchInput" placeholder="Search documentation..." autocomplete="off">
                <div class="search-results" id="searchResults"></div>
            </div>
            <nav class="nav">
                <a href="/0x6C6F6C/">Fleet</a>
                <a href="/0x6C6F6C/moves/">Moves</a>
                <a href="/0x6C6F6C/positions/">Positions</a>
                <a href="/0x6C6F6C/shards/">Shards</a>
                <a href="/0x6C6F6C/docs/" style="color: var(--bright-maroon);">Docs</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">Documentation</h1>
            <p class="page-desc">Complete reference for OUIRISE agent fleet operations. Press / to search.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="stat-docs">0</div>
                <div class="stat-label">Documents</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">3</div>
                <div class="stat-label">Sections</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">1</div>
                <div class="stat-label">API</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">俊达</div>
                <div class="stat-label">Sigil</div>
            </div>
        </div>

        <div class="sections-grid" id="sectionsGrid"></div>
    </main>

    <footer>
        <span class="footer-sigil">俊达</span>
        <span class="footer-text">0x6C6F6C // Documentation // Global RAG</span>
    </footer>

    <script>
        const sections = {
            moves: {
                title: 'MOVES',
                description: 'Operational playbooks, creative frameworks, and tactical documentation.',
                url: '/0x6C6F6C/moves/',
                docs: [
                    { title: 'ART', tag: 'Creative', url: '/0x6C6F6C/moves/art/' },
                    { title: 'ARTSCI', tag: 'Method', url: '/0x6C6F6C/moves/artsci/' },
                    { title: 'CULTURESCAN', tag: 'Intel', url: '/0x6C6F6C/moves/culturescan/' },
                    { title: 'CYBERCHESS', tag: 'Strategy', url: '/0x6C6F6C/moves/cyberchess/' },
                    { title: 'DESKTOP_SIM', tag: 'Tutorial', url: '/0x6C6F6C/moves/desktop_sim/' },
                    { title: 'INSPIRE', tag: 'Motivation', url: '/0x6C6F6C/moves/inspire/' },
                    { title: 'LANG', tag: 'AI', url: '/0x6C6F6C/moves/lang/' },
                    { title: 'NAV', tag: 'Arch', url: '/0x6C6F6C/moves/nav/' },
                    { title: 'SKILLCREATOR', tag: 'Dev', url: '/0x6C6F6C/moves/skillcreator/' },
                    { title: 'SWEBENCH', tag: 'Benchmark', url: '/0x6C6F6C/moves/swebench/' },
                    { title: 'THEME', tag: 'Design', url: '/0x6C6F6C/moves/theme/' },
                    { title: 'TOOLS', tag: 'Architecture', url: '/0x6C6F6C/moves/tools/' },
                    { title: 'UI', tag: 'Interface', url: '/0x6C6F6C/moves/ui/' },
                    { title: 'UX', tag: 'Experience', url: '/0x6C6F6C/moves/ux/' }
                ]
            },
            positions: {
                title: 'POSITIONS',
                description: 'Role definitions, fleet organization, engagement frameworks.',
                url: '/0x6C6F6C/positions/',
                docs: [
                    { title: '0', tag: 'Origin', url: '/0x6C6F6C/positions/0/' },
                    { title: 'B4D2', tag: 'Role', url: '/0x6C6F6C/positions/b4d2/' },
                    { title: 'CONSCIOUSNESS', tag: 'Model', url: '/0x6C6F6C/positions/consciousness/' },
                    { title: 'CONTEXT', tag: 'Protocol', url: '/0x6C6F6C/positions/context/' },
                    { title: 'CONTRACTS', tag: 'Legal', url: '/0x6C6F6C/positions/contracts/' },
                    { title: 'FLEET', tag: 'Registry', url: '/0x6C6F6C/positions/fleet/' },
                    { title: 'MUMININ', tag: 'Position', url: '/0x6C6F6C/positions/muminin/' }
                ]
            },
            shards: {
                title: 'SHARDS',
                description: 'Modular capabilities, licenses, skill definitions.',
                url: '/0x6C6F6C/shards/',
                docs: [
                    { title: 'SKILLS', tag: 'Capabilities', url: '/0x6C6F6C/shards/skills/' }
                ]
            }
        };

        const searchIndex = [];
        Object.entries(sections).forEach(([key, section]) => {
            section.docs.forEach(doc => {
                searchIndex.push({
                    title: doc.title,
                    section: section.title,
                    tag: doc.tag,
                    url: doc.url
                });
            });
        });

        document.getElementById('stat-docs').textContent = searchIndex.length;

        const sectionsGrid = document.getElementById('sectionsGrid');
        Object.entries(sections).forEach(([key, section]) => {
            const card = document.createElement('div');
            card.className = 'section-card';
            const docsList = section.docs.slice(0, 5).map(doc => 
                `<li><a href="${doc.url}">${doc.title}<span class="doc-tag">${doc.tag}</span></a></li>`
            ).join('');
            const moreCount = section.docs.length > 5 ? section.docs.length - 5 : 0;
            const moreLink = moreCount > 0 ? `<a href="${section.url}" class="view-all">+ ${moreCount} more</a>` : '';
            card.innerHTML = `
                <div class="section-header">
                    <h2 class="section-title">${section.title}</h2>
                    <span class="section-count">${section.docs.length}</span>
                </div>
                <p class="section-desc">${section.description}</p>
                <ul class="section-docs">${docsList}</ul>
                ${moreLink}
            `;
            sectionsGrid.appendChild(card);
        });

        // Search
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query.length < 2) {
                searchResults.classList.remove('active');
                return;
            }
            const matches = searchIndex.filter(item => 
                item.title.toLowerCase().includes(query) ||
                item.section.toLowerCase().includes(query) ||
                item.tag.toLowerCase().includes(query)
            ).slice(0, 8);
            if (matches.length === 0) {
                searchResults.innerHTML = '<div class="search-result-item"><div class="search-result-title">No results</div></div>';
            } else {
                searchResults.innerHTML = matches.map(item => `
                    <div class="search-result-item" onclick="window.location='${item.url}'">
                        <div class="search-result-title">${item.title}</div>
                        <div class="search-result-meta">${item.section} // ${item.tag}</div>
                    </div>
                `).join('');
            }
            searchResults.classList.add('active');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                searchResults.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
            if (e.key === 'Escape') {
                searchResults.classList.remove('active');
                searchInput.blur();
            }
        });
    </script>
</body>
</html>
