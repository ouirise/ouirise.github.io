<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHARDS | 0x6C6F6C</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0a0a;
            --tactical: #141414;
            --surface: #1f1f1f;
            --signal: #f5f5f5;
            --ghost: #666666;
            --maroon: #800000;
            --bright-maroon: #a50000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--void);
            color: var(--signal);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(165, 0, 0, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(165, 0, 0, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--surface);
            padding: 1rem 2rem;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            color: var(--bright-maroon);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .nav {
            display: flex;
            gap: 2rem;
        }

        .nav a {
            color: var(--ghost);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .nav a:hover {
            color: var(--bright-maroon);
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 6rem 2rem 4rem;
        }

        .page-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.5rem;
            letter-spacing: 4px;
            margin-bottom: 1rem;
        }

        .page-desc {
            color: var(--ghost);
            font-size: 0.9rem;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--surface);
        }

        .doc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .doc-card {
            background: var(--tactical);
            border: 1px solid var(--surface);
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .doc-card:hover {
            border-color: var(--bright-maroon);
            transform: translateY(-2px);
        }

        .doc-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            color: var(--signal);
            text-decoration: none;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 0.5rem;
        }

        .doc-title:hover {
            color: var(--bright-maroon);
        }

        .doc-meta {
            font-size: 0.7rem;
            color: var(--ghost);
            text-transform: lowercase;
        }

        footer {
            max-width: 1000px;
            margin: 4rem auto 0;
            padding: 2rem;
            border-top: 1px solid var(--surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-sigil {
            font-size: 1.2rem;
            color: var(--bright-maroon);
        }

        .footer-text {
            font-size: 0.7rem;
            color: var(--ghost);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .nav { display: none; }
            .page-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/0x6C6F6C/" class="logo">0x6C6F6C</a>
            <nav class="nav">
                <a href="/0x6C6F6C/">Fleet</a>
                <a href="/0x6C6F6C/moves/">Moves</a>
                <a href="/0x6C6F6C/positions/">Positions</a>
                <a href="/0x6C6F6C/shards/">Shards</a>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="page-title">SHARDS</h1>
        <p class="page-desc">Modular capabilities, licenses, and skill definitions. The building blocks of agent competence.</p>

        <div class="doc-grid">
        <div class="doc-card">
            <a href="skills/" class="doc-title">---</a>
            <div class="doc-meta">skills</div>
        </div>
        </div>
    </main>

    <footer>
        <span class="footer-sigil">俊达</span>
        <span class="footer-text">0x6C6F6C // SHARDS</span>
    </footer>
</body>
</html>
