<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Selector | OUIRISE INITIATIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0a0a;
            --tactical: #141414;
            --surface: #1f1f1f;
            --signal: #f5f5f5;
            --ghost: #666666;
            --maroon: #800000;
            --bright-maroon: #a50000;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--void);
            color: var(--signal);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(128, 0, 0, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(128, 0, 0, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .font-bebas { font-family: 'Bebas Neue', sans-serif; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            border-bottom: 1px solid var(--surface);
            position: relative;
        }

        .glyph-watermark {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            opacity: 0.3;
            color: var(--bright-maroon);
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.5rem;
            color: var(--bright-maroon);
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--ghost);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .meta-line {
            font-size: 0.7rem;
            color: var(--ghost);
            margin-top: 1rem;
            letter-spacing: 0.1em;
        }

        .search-container {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 3rem;
            border: 1px solid var(--surface);
        }

        #search-input {
            flex: 1;
            max-width: 500px;
            padding: 1rem 1.5rem;
            font-size: 0.9rem;
            border: none;
            background-color: var(--tactical);
            color: var(--signal);
            font-family: 'JetBrains Mono', monospace;
        }

        #search-input::placeholder {
            color: var(--ghost);
        }

        #search-input:focus {
            outline: none;
            background-color: var(--void);
        }

        button {
            background-color: transparent;
            color: var(--bright-maroon);
            border: none;
            border-left: 1px solid var(--surface);
            padding: 1rem 2rem;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--bright-maroon);
            color: var(--signal);
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .channel-card {
            background-color: var(--tactical);
            border: 1px solid var(--surface);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .channel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--maroon);
            transition: all 0.3s ease;
        }

        .channel-card:hover {
            border-color: var(--bright-maroon);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(128, 0, 0, 0.3);
        }

        .channel-card:hover::before {
            background: var(--bright-maroon);
        }

        .channel-thumbnail {
            height: 160px;
            background: linear-gradient(135deg, var(--void) 0%, var(--tactical) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border-bottom: 1px solid var(--surface);
            position: relative;
        }

        .channel-thumbnail::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(128, 0, 0, 0.03) 10px,
                rgba(128, 0, 0, 0.03) 20px
            );
        }

        .channel-info {
            padding: 1.25rem;
        }

        .channel-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            color: var(--signal);
        }

        .channel-description {
            font-size: 0.8rem;
            color: var(--ghost);
            line-height: 1.5;
        }

        .channel-meta {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .tag {
            font-size: 0.65rem;
            background: rgba(165, 0, 0, 0.15);
            color: var(--bright-maroon);
            padding: 0.25rem 0.5rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .blade-accent {
            position: absolute;
            top: 0;
            right: 0;
            width: 40px;
            height: 100%;
            background: linear-gradient(180deg, transparent 0%, rgba(165, 0, 0, 0.1) 50%, transparent 100%);
            pointer-events: none;
        }

        .status-dot {
            position: absolute;
            top: 1rem;
            left: 1rem;
            width: 8px;
            height: 8px;
            background: var(--bright-maroon);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px var(--bright-maroon); }
            50% { opacity: 0.5; box-shadow: 0 0 15px var(--bright-maroon); }
        }

        .nav-back {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--ghost);
            text-decoration: none;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            transition: color 0.2s;
        }

        .nav-back:hover {
            color: var(--bright-maroon);
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            border-top: 1px solid var(--surface);
            margin-top: 4rem;
        }

        .footer-sigil {
            font-size: 1.5rem;
            color: var(--bright-maroon);
            margin-bottom: 0.5rem;
        }

        .footer-text {
            font-size: 0.75rem;
            color: var(--ghost);
            letter-spacing: 0.1em;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .search-container { flex-direction: column; border: none; }
            #search-input { max-width: 100%; border: 1px solid var(--surface); }
            button { border: 1px solid var(--surface); border-top: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/archive/" class="nav-back">← // Return to Flight Logs</a>
        
        <header>
            <div class="glyph-watermark">🌫️🌒</div>
            <h1>FLIGHT SELECTOR</h1>
            <p class="tagline">Zero visibility, infinite content</p>
            <p class="meta-line">// EST. 2025 // CLT // SECURE CHANNEL</p>
        </header>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search flights or missions...">
            <button onclick="searchChannels()">Search</button>
        </div>

        <div class="channel-grid" id="channel-grid">
            <!-- Channel cards will be inserted here -->
        </div>
    </div>

    <footer>
        <div class="footer-sigil">🌫️🌒</div>
        <p class="footer-text">OUIRISE INITIATIVE // NO EXTRACTION // ALL WAYS</p>
    </footer>

    <script>
        // Flight data — missions and resources
        const channels = [
            {
                id: 1,
                name: "Code Ninjas",
                description: "Learn web development, algorithms, and systems architecture. Zero to hero.",
                thumbnail: "👨‍💻",
                tags: ["CODE", "EDU"]
            },
            {
                id: 2,
                name: "WebOps Command",
                description: "Web operations, infrastructure security, and cloud deployment tactics.",
                thumbnail: "🌐",
                tags: ["OPS", "CLOUD"]
            },
            {
                id: 3,
                name: "ShadowBlade Gaming",
                description: "Gaming walkthroughs, strategy guides, and tactical analysis.",
                thumbnail: "🎮",
                tags: ["GAME", "STRAT"]
            },
            {
                id: 4,
                name: "Zero-Day Intel",
                description: "Latest cybersecurity threats, digital forensics, and incident response.",
                thumbnail: "🔒",
                tags: ["SEC", "INTEL"]
            },
            {
                id: 5,
                name: "Clean Code Protocol",
                description: "Clean code practices, refactoring, and software craftsmanship.",
                thumbnail: "🛠️",
                tags: ["CODE", "CRAFT"]
            },
            {
                id: 6,
                name: "Flight Academy",
                description: "Master the art of web development with practical mission projects.",
                thumbnail: "🎓",
                tags: ["EDU", "WEB"]
            }
        ];

        // Function to display channel cards
        function displayChannels(channelsToShow) {
            const channelGrid = document.getElementById('channel-grid');
            channelGrid.innerHTML = '';
            
            channelsToShow.forEach(channel => {
                const channelCard = document.createElement('div');
                channelCard.className = 'channel-card';
                channelCard.innerHTML = `
                    <div class="channel-thumbnail">
                        <div class="status-dot"></div>
                        ${channel.thumbnail}
                    </div>
                    <div class="channel-info">
                        <h3 class="channel-title">${channel.name}</h3>
                        <p class="channel-description">${channel.description}</p>
                        <div class="channel-meta">
                            ${channel.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                    <div class="blade-accent"></div>
                `;
                channelGrid.appendChild(channelCard);
            });
        }

        // Function to search channels
        function searchChannels() {
            const query = document.getElementById('search-input').value.toLowerCase();
            if (!query) {
                displayChannels(channels);
                return;
            }
            
            const filteredChannels = channels.filter(channel => 
                channel.name.toLowerCase().includes(query) || 
                channel.description.toLowerCase().includes(query) ||
                channel.tags.some(tag => tag.toLowerCase().includes(query))
            );
            
            displayChannels(filteredChannels);
        }

        // Allow Enter key to search
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchChannels();
            }
        });

        // Initial display
        displayChannels(channels);
    </script>
</body>
</html>
