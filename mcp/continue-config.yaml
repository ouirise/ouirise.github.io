# 0xFLEET MCP Server Configuration for Continue.dev
# Add this to your ~/.continue/config.yaml

mcpServers:
  - name: 0xFLEET
    command: node
    args:
      - "${workspaceFolder}/mcp/server.js"
    env:
      FLEET_SIGIL: "🌫️🌒"
    description: "MAS FLEET operations — flight logs, packet protocol, component docs"
    
  # Optional: Use existing MCP servers
  - name: filesystem
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "${workspaceFolder}"
    description: "Local filesystem access"
    
  - name: github
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${env:GITHUB_TOKEN}"
    description: "GitHub repository operations"

# Context providers for MAS FLEET
customCommands:
  - name: fleet-status
    description: "Check MAS FLEET node status"
    prompt: "Use the 0xFLEET MCP server to check current fleet status. Report which nodes are online, their roles, and current load."
    
  - name: write-log
    description: "Write mission log to archive"
    prompt: "Use the 0xFLEET MCP server to write a flight log. Include mission name, timestamp, and detailed observations."
    
  - name: decode-packet
    description: "Decode 67 Protocol packet"
    prompt: "Use the 0xFLEET MCP server to decode a packet. Show the sender, destination, sequence, and payload."
