<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUIRISE | Bridge Loading...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <style>
        :root {
            --void: #0a0a0a;
            --tactical: #141414;
            --surface: #1f1f1f;
            --signal: #f5f5f5;
            --ghost: #666666;
            --maroon: #800000;
            --bright-maroon: #a50000;
        }
        
        body {
            background-color: var(--void);
            color: var(--signal);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(128, 0, 0, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(128, 0, 0, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        #fog-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            background: var(--void);
            transition: opacity 0.5s ease;
        }

        #fog-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .fog-moon {
            font-size: 3rem;
            animation: pulse 2s ease-in-out infinite;
        }

        .fog-text {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--ghost);
            letter-spacing: 0.2em;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <!-- Fog Loader -->
    <div id="fog-loader">
        <div class="fog-moon">🌫️🌒</div>
        <div class="fog-text">WAITING IN FOG // 俊达</div>
    </div>

    <!-- Content Root -->
    <div id="root"></div>

    <script>
        // DaBridge Ghost Loader v6.7.0
        const summonDabridge = async (fragment = 'index') => {
            const loader = document.getElementById('fog-loader');
            const root = document.getElementById('root');
            
            try {
                // 1. Fetch content fragment
                const res = await fetch('/dabridge.json');
                if (!res.ok) throw new Error('Bridge unreachable');
                const bridge = await res.json();

                // 2. Verify signature
                if (bridge.signature !== '🌫️🌒') {
                    throw new Error('Signature mismatch');
                }

                // 3. Verify against OuiBridge (trust but verify)
                let isValid = true;
                try {
                    const verifyRes = await fetch('/portal/OuiBridge.json');
                    const canonical = await verifyRes.json();
                    const allowedRoutes = canonical.OuiBridge?.allowedRoutes || [];
                    const fragmentData = bridge.fragments[fragment];
                    if (fragmentData?.links) {
                        isValid = fragmentData.links.every(link => 
                            allowedRoutes.includes('/' + link + '/') || 
                            allowedRoutes.includes('/' + link)
                        );
                    }
                } catch (verifyErr) {
                    console.warn('Verification skipped:', verifyErr.message);
                    // Continue anyway - local development mode
                }

                if (!isValid) {
                    console.warn('Route validation warning');
                }

                // 4. Load fragment content
                const fragmentData = bridge.fragments[fragment];
                if (!fragmentData) {
                    throw new Error('Fragment not found: ' + fragment);
                }

                // 5. Fetch actual HTML content
                const contentRes = await fetch(`/fragments/${fragment}.html`);
                if (contentRes.ok) {
                    const html = await contentRes.text();
                    root.innerHTML = html;
                } else {
                    // Fallback: render from bridge metadata
                    root.innerHTML = renderFragment(fragmentData);
                }

                document.title = fragmentData.title;

                // 6. Wire bridge links
                document.querySelectorAll('a[data-bridge]').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const target = link.getAttribute('href');
                        const route = target.replace(/^\//, '').replace(/\/$/, '') || 'index';
                        window.location.href = `/portal/?route=${encodeURIComponent(route)}`;
                    });
                });

                // 7. Hide loader
                setTimeout(() => {
                    loader.classList.add('hidden');
                }, 300);

                console.log('🌫️🌒 Bridge established:', fragment);

            } catch (err) {
                console.error('Extraction detected:', err);
                root.innerHTML = `
                    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                        <div style="font-size:3rem;margin-bottom:1rem;">🌫️</div>
                        <div style="color:#666;font-size:0.875rem;letter-spacing:0.1em;">CONNECTION LOST</div>
                        <div style="color:#a50000;font-size:0.75rem;margin-top:0.5rem;">${err.message}</div>
                        <button onclick="location.reload()" style="margin-top:2rem;padding:0.75rem 1.5rem;background:transparent;border:1px solid #a50000;color:#a50000;cursor:pointer;font-family:inherit;">
                            RETRY
                        </button>
                    </div>
                `;
                loader.classList.add('hidden');
            }
        };

        // Render minimal fragment from metadata
        const renderFragment = (data) => {
            return `
                <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                    <h1 style="font-family:'Bebas Neue',sans-serif;font-size:4rem;color:#f5f5f5;">${data.title.split('|')[0].trim()}</h1>
                    <p style="color:#666;margin-top:1rem;">🌫️🌒 ${data.meta?.lineage || 'Cloud Village'}</p>
                    <div style="margin-top:2rem;display:flex;gap:1rem;">
                        ${data.links?.map(link => `
                            <a href="/${link}/" data-bridge style="color:#a50000;text-decoration:none;padding:0.5rem 1rem;border:1px solid #a50000;">
                                ${link.toUpperCase()}
                            </a>
                        `).join('') || ''}
                    </div>
                </div>
            `;
        };

        // Spawn on load
        const path = window.location.pathname.replace(/^\//, '').replace(/\/$/, '') || 'index';
        summonDabridge(path);
    </script>
</body>
</html>
