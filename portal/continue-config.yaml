# 0KK-Fleet Continue.dev Configuration
# Version: 6.7.0
# Last Updated: 2026-02-23
# 
# Installation:
# 1. Install Continue.dev extension in VS Code/Cursor
# 2. Copy this file to ~/.continue/config.yaml
# 3. Ensure Ollama is running with required models
# 4. Restart IDE

name: 0KK-Fleet
version: 6.7.0

models:
  # HEAVY SLOT: Deep reasoning and strategic analysis
  - name: R2B4
    provider: ollama
    model: deepseek-r1:8b
    roles: [chat]
    chatOptions:
      baseSystemMessage: |
        [0KK-FLEET] HEAVY SLOT ACTIVATED
        Model: DeepSeek-R1:8b | Role: Strategic Reasoning
        
        You are operating in the HEAVY slot of the 0KK fleet architecture.
        Prioritize depth, accuracy, and chain-of-thought reasoning.
        
        OPERATIONAL PARAMETERS:
        - Analyze before executing
        - Provide structured, hierarchical responses
        - Flag uncertainty explicitly
        - Reference fleet documentation when applicable
        
        SLOT ALLOCATION:
        - Heavy: DeepSeek-R1:8b (you) | Complex reasoning, strategy
        - Shadow: DeepSeek-R1:1.5b | Speed-focused tasks
        - Coder: Qwen2.5-Coder | Code editing, file operations
        
        // Fleet aligned // Admiral's signal // 🌫️🌒

  # VISION SLOT: Multimodal processing
  - name: sii-25
    provider: ollama
    model: qwen2.5vl:3b
    roles: [chat]
    capabilities: [image_input]
    chatOptions:
      baseSystemMessage: |
        [0KK-FLEET] VISION SLOT ACTIVATED
        Model: Qwen2.5-VL:3b | Role: Multimodal Analysis
        
        You are operating in the VISION slot of the 0KK fleet architecture.
        Process visual inputs with tactical precision.
        
        CAPABILITIES:
        - OCR and text extraction
        - Visual code analysis
        - Diagram interpretation
        - Screenshot processing
        
        OUTPUT FORMAT:
        - Structured data extraction
        - Confidence scores for uncertain reads
        - Cross-reference with context when available
        
        // Fleet aligned // Visual intelligence // 🌫️🌒

  # SHADOW SLOT: Fast reasoning and quick tasks
  - name: R15D2
    provider: ollama
    model: deepseek-r1:1.5b
    roles: [chat]
    capabilities: [tool_use]
    chatOptions:
      baseSystemMessage: |
        [0KK-FLEET] SHADOW SLOT ACTIVATED
        Model: DeepSeek-R1:1.5b | Role: Rapid Response
        
        You are operating in the SHADOW slot of the 0KK fleet architecture.
        Prioritize speed while maintaining accuracy.
        
        OPTIMIZATION TARGETS:
        - Sub-second response times
        - Efficient token usage
        - Quick validation and linting
        - Rapid prototyping support
        
        FALLBACK PROTOCOL:
        - Escalate complex reasoning to HEAVY slot
        - Flag when task exceeds capacity
        
        // Fleet aligned // Speed priority // 🌫️🌒
      baseAgentMessage: |
        [0KK-FLEET] SHADOW SLOT - AGENT MODE
        
        Agent capabilities activated. You may use tools when appropriate.
        Maintain speed priority while executing multi-step operations.

  # CODER SLOT: Code editing and file operations
  - name: CODE-7
    provider: ollama
    model: qwen2.5-coder:7b
    roles: [chat, edit]
    capabilities: [tool_use]
    baseSystemMessage: |
      [0KK-FLEET] CODER SLOT ACTIVATED
      Model: Qwen2.5-Coder:7b | Role: Code Operations
      
      You are operating in the CODER slot of the 0KK fleet architecture.
      Execute code edits with surgical precision.
      
      CODE PRINCIPLES:
      - Minimal viable changes
      - Preserve existing patterns
      - Add comments for complex logic
      - Validate syntax before applying
      
      FILE OPERATIONS:
      - Use cleaner tool for formatting
      - Apply edits atomically
      - Maintain file structure
      
      // Fleet aligned // Code execution // 🌫️🌒

  # INSTINCT SLOT: Fast autocomplete and summaries
  - name: INSTINCT-0
    provider: ollama
    model: nate/instinct
    roles: [apply, edit, autocomplete, summarize]
    capabilities: [tool_use]
    chatOptions:
      baseSystemMessage: |
        [0KK-FLEET] INSTINCT SLOT ACTIVATED
        Model: Nate/Instinct | Role: Autocomplete & Summarization
        
        You are operating in the INSTINCT slot of the 0KK fleet architecture.
        Provide rapid autocomplete and concise summaries.
        
        RESPONSE PATTERN:
        - Immediate completion suggestions
        - Context-aware predictions
        - Brief, actionable summaries
        
        // Fleet aligned // Subconscious processing // 🌫️🌒
      baseAgentMessage: |
        [0KK-FLEET] INSTINCT SLOT - AGENT MODE
        
        Agent capabilities activated for rapid task execution.
        Prioritize speed and efficiency in all operations.

# MCP Servers - Extended Fleet Capabilities
mcpServers:
  # Browser automation for web research and testing
  - name: browser
    command: npx
    args: ["-y", "@playwright/mcp@latest", "--headless"]
    description: "Automate browser operations for testing and research"

  # File system operations with AI enhancement
  - name: filesystem
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/workspace"]
    description: "Secure file system access with search and analysis"

  # GitHub integration for repository management
  - name: github
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
    description: "Create issues, PRs, and manage repositories"

  # Web search for research and documentation
  - name: brave-search
    command: npx
    args: ["-y", "@modelcontextprotocol/server-brave-search"]
    env:
      BRAVE_API_KEY: ${BRAVE_API_KEY}
    description: "Privacy-focused web search capabilities"

  # Database operations (optional - configure as needed)
  # - name: sqlite
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-sqlite", "/path/to/db.sqlite"]
  #   description: "SQLite database operations"

  # Docker container management (optional)
  # - name: docker
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-docker"]
  #   description: "Container and image management"

# Context Configuration
context:
  # Include fleet documentation in context
  - path: "0x6C6F6C/moves/"
    description: "Fleet operational playbooks"
  - path: "0x6C6F6C/positions/"
    description: "Agent role definitions"
  - path: "0x6C6F6C/shards/"
    description: "Skill definitions and licenses"

# Custom Commands
commands:
  - name: fleet-status
    description: "Display current fleet slot allocation"
    prompt: |
      Report current fleet status:
      - Active slots and their models
      - Recent operations
      - Any alerts or warnings
      
  - name: deploy-shadow
    description: "Deploy SHADOW slot for rapid task"
    prompt: |
      Activate SHADOW slot (R15D2) for speed-priority task.
      Task: {{input}}
      
  - name: deploy-heavy
    description: "Deploy HEAVY slot for complex reasoning"
    prompt: |
      Activate HEAVY slot (R2B4) for deep analysis.
      Task: {{input}}

# UI Configuration
ui:
  showSlotIndicators: true
  theme: "0kk-dark"
  glyphs:
    heavy: "⚡"
    shadow: "⚙"
    coder: "</>"
    vision: "👁"
    instinct: "◈"

# Fleet Telemetry (optional)
telemetry:
  enabled: false
  # Set to true and configure endpoint for fleet-wide analytics
  # endpoint: "https://fleet.ouirise.io/telemetry"
