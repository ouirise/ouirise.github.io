<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUNDA | Bridge Loading...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0a0a;
            --tactical: #141414;
            --surface: #1f1f1f;
            --signal: #f5f5f5;
            --ghost: #666666;
            --maroon: #800000;
            --bright-maroon: #a50000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'JetBrains Mono', monospace;
        }

        body {
            overflow: hidden;
            height: 100vh;
            background: var(--void);
        }

        /* Fog Loader */
        #fog-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            background: var(--void);
            transition: opacity 0.4s ease;
        }

        #fog-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .fog-moon {
            font-size: 2.5rem;
            animation: breathe 2s ease-in-out infinite;
        }

        .fog-text {
            margin-top: 0.75rem;
            font-size: 0.625rem;
            color: var(--ghost);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.9; }
        }

        /* Desktop Container */
        #desktop {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: var(--void);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #desktop.loaded {
            opacity: 1;
        }

        /* Maroon Tactical Grid */
        #desktop::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(165, 0, 0, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(165, 0, 0, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Grain Texture */
        #desktop::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <!-- Fog Loader -->
    <div id="fog-loader">
        <div class="fog-moon">🌫️🌒</div>
        <div class="fog-text">Portal Gateway // 俊达</div>
    </div>

    <!-- Desktop Root -->
    <div id="desktop"></div>

    <script>
        // Portal Gateway v6.7.0
        const summonPortal = async () => {
            const loader = document.getElementById('fog-loader');
            const desktop = document.getElementById('desktop');
            
            try {
                // 1. Parse route from URL
                const params = new URLSearchParams(window.location.search);
                const route = params.get('route') || 'portal';
                
                // 2. Fetch OuiBridge (source of truth)
                const bridgeRes = await fetch('/portal/OuiBridge.json');
                if (!bridgeRes.ok) throw new Error('OuiBridge unreachable');
                const ouiBridge = await bridgeRes.json();

                // 3. Verify signature
                if (ouiBridge.OuiBridge?.signature !== '🌫️🌒') {
                    throw new Error('Lineage mismatch');
                }

                // 4. Validate route
                const allowedRoutes = ouiBridge.OuiBridge.allowedRoutes || [];
                const targetPath = route === 'index' ? '/' : `/${route}/`;
                
                if (!allowedRoutes.includes(targetPath)) {
                    console.warn('Route not in allowed list:', targetPath);
                }

                // 5. Fetch dabridge fragment
                const dabridgeUrl = ouiBridge.OuiBridge.portaldabridge?.apps[route] 
                    || '/dabridge.json';
                
                const fragmentRes = await fetch(dabridgeUrl);
                if (!fragmentRes.ok) throw new Error('Fragment unreachable');
                const fragment = await fragmentRes.json();

                // 6. Verify fragment signature
                if (fragment.signature !== '🌫️🌒') {
                    throw new Error('Fragment signature invalid');
                }

                // 7. Load content based on route
                if (route === 'portal' || route === 'client') {
                    // Load JUNDA desktop environment
                    await loadJundaDesktop(desktop, fragment);
                } else {
                    // Load generic fragment
                    await loadFragment(desktop, route, fragment);
                }

                document.title = fragment.fragments?.[route]?.title || 'JUNDA';

                // 8. Reveal
                desktop.classList.add('loaded');
                setTimeout(() => {
                    loader.classList.add('hidden');
                }, 200);

                console.log('🌫️🌒 Portal established:', route);

            } catch (err) {
                console.error('Portal breach:', err);
                desktop.innerHTML = `
                    <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;z-index:10000;">
                        <div style="font-size:2.5rem;margin-bottom:1rem;">🌫️</div>
                        <div style="color:#666;font-size:0.75rem;letter-spacing:0.1em;">PORTAL UNSTABLE</div>
                        <div style="color:#a50000;font-size:0.625rem;margin-top:0.5rem;">${err.message}</div>
                        <button onclick="location.href='/'" style="margin-top:2rem;padding:0.625rem 1.25rem;background:transparent;border:1px solid #a50000;color:#a50000;cursor:pointer;font-family:inherit;font-size:0.625rem;letter-spacing:0.1em;">
                            RETURN TO VOID
                        </button>
                    </div>
                `;
                desktop.classList.add('loaded');
                loader.classList.add('hidden');
            }
        };

        // Load JUNDA Desktop Environment
        const loadJundaDesktop = async (container, fragment) => {
            // Fetch the desktop HTML fragment
            try {
                const res = await fetch('/fragments/portal-desktop.html');
                if (res.ok) {
                    const html = await res.text();
                    container.innerHTML = html;
                    
                    // Execute any scripts in the fragment
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => {
                            newScript.setAttribute(attr.name, attr.value);
                        });
                        newScript.textContent = oldScript.textContent;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                } else {
                    throw new Error('Desktop fragment not found');
                }
            } catch (err) {
                // Render minimal desktop
                container.innerHTML = renderMinimalDesktop(fragment);
            }
        };

        // Load generic fragment
        const loadFragment = async (container, route, fragment) => {
            const fragmentData = fragment.fragments?.[route];
            container.innerHTML = `
                <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                    <h1 style="font-family:'Bebas Neue',sans-serif;font-size:3rem;color:#f5f5f5;">${fragmentData?.title || route}</h1>
                    <p style="color:#666;margin-top:0.75rem;font-size:0.75rem;">🌫️🌒 ${fragmentData?.meta?.lineage || 'Cloud Village'}</p>
                    <a href="/portal/" style="margin-top:2rem;color:#a50000;text-decoration:none;font-size:0.625rem;letter-spacing:0.1em;border:1px solid #a50000;padding:0.5rem 1rem;">
                        RETURN TO PORTAL
                    </a>
                </div>
            `;
        };

        // Minimal desktop render
        const renderMinimalDesktop = (fragment) => {
            return `
                <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;">
                    <div style="font-family:'Bebas Neue',sans-serif;font-size:4rem;color:#f5f5f5;letter-spacing:0.1em;">JUNDA</div>
                    <div style="color:#a50000;font-size:0.75rem;margin-top:0.5rem;letter-spacing:0.2em;">CLIENT PORTAL</div>
                    <div style="margin-top:2rem;display:flex;gap:1.5rem;">
                        <div style="text-align:center;">
                            <div style="width:48px;height:48px;border:1px solid #1f1f1f;display:flex;align-items:center;justify-content:center;margin:0 auto;">
                                <span style="color:#a50000;font-size:1.25rem;">📄</span>
                            </div>
                            <div style="color:#f5f5f5;font-size:0.625rem;margin-top:0.5rem;">Prompts</div>
                        </div>
                        <div style="text-align:center;">
                            <div style="width:48px;height:48px;border:1px solid #1f1f1f;display:flex;align-items:center;justify-content:center;margin:0 auto;">
                                <span style="color:#a50000;font-size:1.25rem;">✉️</span>
                            </div>
                            <div style="color:#f5f5f5;font-size:0.625rem;margin-top:0.5rem;">Contact</div>
                        </div>
                    </div>
                </div>
                <div style="position:fixed;bottom:0;left:0;right:0;height:44px;background:rgba(10,10,10,0.95);border-top:1px solid #1f1f1f;display:flex;align-items:center;padding:0 12px;z-index:100;">
                    <div style="width:36px;height:36px;border:1px solid #1f1f1f;display:flex;align-items:center;justify-content:center;">
                        <span style="font-family:'Bebas Neue',sans-serif;font-size:12px;color:#a50000;letter-spacing:2px;">俊达</span>
                    </div>
                    <div style="margin-left:auto;color:#f5f5f5;font-size:11px;" id="clock">00:00</div>
                </div>
            `;
        };

        // Spawn portal
        summonPortal();
    </script>
</body>
</html>
