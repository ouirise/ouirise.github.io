<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | OUIRISE INITIATIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0a0a;
            --tactical: #141414;
            --surface: #1f1f1f;
            --signal: #f5f5f5;
            --ghost: #666666;
            --maroon: #800000;
            --bright-maroon: #a50000;
            --black-primary: #0a0a0a;
            --black-secondary: #111111;
            --grey-dark: #2a2a2a;
            --grey-dim: #555555;
            --white: #e0e0e0;
        }
        
        body {
            background-color: var(--void);
            color: var(--signal);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(128, 0, 0, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(128, 0, 0, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .font-bebas { font-family: 'Bebas Neue', sans-serif; }
        
        .nav-link {
            position: relative;
            transition: color 0.2s;
        }
        
        .nav-link:hover { color: var(--bright-maroon); }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--bright-maroon);
            transition: width 0.2s;
        }
        
        .nav-link:hover::after { width: 100%; }

        /* Dropdown Styles - Minimal Functional */
        .dropdown-menu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
            position: absolute;
            top: 100%;
            left: 0;
            background: var(--tactical);
            border: 1px solid var(--surface);
            min-width: 200px;
            padding: 0.5rem 0;
            z-index: 50;
        }
        .dropdown-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        /* Desktop hover */
        @media (min-width: 768px) {
            .dropdown:hover .dropdown-menu,
            .dropdown-menu:hover {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }
        }
        .dropdown-arrow {
            font-size: 0.6rem;
            transition: transform 0.2s;
        }
        .dropdown-arrow.open {
            transform: rotate(180deg);
        }
        .dropdown-item {
            display: block;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            color: var(--ghost);
            transition: all 0.2s;
        }
        .dropdown-item:hover {
            background: var(--surface);
            color: var(--bright-maroon);
        }
        @media (max-width: 767px) {
            .dropdown-menu {
                position: static;
                opacity: 1;
                visibility: visible;
                transform: none;
                display: none;
                border: none;
                border-left: 2px solid var(--bright-maroon);
                margin-left: 1rem;
                margin-top: 0.5rem;
                background: transparent;
                min-width: auto;
            }
            .dropdown-menu.open {
                display: block;
                opacity: 1;
                visibility: visible;
                transform: none;
            }
        }

        #nav-toggle { display: none; }

        #mobile-menu {
            display: none;
            position: fixed;
            top: 4rem;
            left: 0;
            width: 100%;
            height: calc(100vh - 4rem);
            background: var(--tactical);
            border-top: 1px solid var(--surface);
            z-index: 50;
            flex-direction: column;
            padding: 2rem;
        }

        #nav-toggle:checked ~ #mobile-menu { display: flex; }

        .hamburger line {
            transition: all 0.3s ease;
            transform-origin: center;
            stroke: var(--signal);
        }
        
        #nav-toggle:checked ~ label .hamburger line:first-child { transform: rotate(45deg) translate(5px, 5px); }
        #nav-toggle:checked ~ label .hamburger line:nth-child(2) { opacity: 0; }
        #nav-toggle:checked ~ label .hamburger line:last-child { transform: rotate(-45deg) translate(5px, -5px); }

        @media (min-width: 768px) {
            #mobile-menu {
                display: flex !important;
                position: static;
                height: auto;
                flex-direction: row;
                background: transparent;
                border: none;
                padding: 0;
                width: auto;
            }
            .hamburger-label { display: none; }
        }

        /* Error Page Styles */
        .error-body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--black-primary);
            color: var(--white);
            min-height: calc(100vh - 64px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .error-body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.2),
                rgba(0, 0, 0, 0.2) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 10;
        }

        .error-body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            z-index: 9;
        }

        .error-container {
            text-align: center;
            z-index: 20;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
        }

        .error-code {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 8rem;
            font-weight: 800;
            color: var(--bright-maroon);
            text-shadow: 0 0 30px rgba(165, 0, 0, 0.5);
            line-height: 1;
            margin-bottom: 1rem;
        }

        .error-title {
            font-family: 'Inter', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--white);
            text-decoration: underline;
            text-decoration-color: var(--maroon);
            text-underline-offset: 8px;
            text-decoration-thickness: 3px;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1rem;
            color: var(--grey-dim);
            margin-bottom: 2rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-box {
            border: 1px solid var(--grey-dark);
            background: rgba(17, 17, 17, 0.95);
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .error-box::before,
        .error-box::after {
            content: "◈";
            position: absolute;
            color: var(--grey-dim);
            font-size: 1.2rem;
        }

        .error-box::before {
            top: 5px;
            left: 10px;
        }

        .error-box::after {
            bottom: 5px;
            right: 10px;
        }

        .home-link {
            display: inline-block;
            border: 1px solid var(--bright-maroon);
            color: var(--white);
            padding: 1rem 2rem;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .home-link:hover {
            background: var(--bright-maroon);
            box-shadow: 0 0 20px rgba(165, 0, 0, 0.4);
        }

        .est-line {
            font-size: 0.7rem;
            color: var(--grey-dim);
            letter-spacing: 0.3em;
            margin-bottom: 1rem;
        }

        @media (max-width: 600px) {
            .error-code { font-size: 5rem; }
            .error-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body class="bg-void text-signal antialiased">

    <!-- Header -->
    <header class="fixed top-0 w-full z-50 bg-void/95 backdrop-blur-md border-b border-[#1a1a1a]">
        <div class="max-w-7xl mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
            <a href="/" class="font-bebas text-2xl tracking-wider text-[#a50000] hover:text-signal transition-colors border-2 border-[#a50000] px-3 py-1">
                OUIRISE
            </a>

            <input type="checkbox" id="nav-toggle">
            
            <label for="nav-toggle" class="hamburger-label cursor-pointer md:hidden p-2 border border-surface hover:bg-surface transition-colors">
                <svg class="hamburger w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <line x1="4" y1="6" x2="20" y2="6" stroke-width="1.5"></line>
                    <line x1="4" y1="12" x2="20" y2="12" stroke-width="1.5"></line>
                    <line x1="4" y1="18" x2="20" y2="18" stroke-width="1.5"></line>
                </svg>
            </label>

            <nav id="mobile-menu" class="mono text-sm uppercase tracking-widest gap-6 md:gap-8 items-start md:items-center">
                <a href="/" class="nav-link py-2 md:py-0">Home</a>
                <a href="/about/" class="nav-link py-2 md:py-0">About</a>
                <div class="dropdown relative" id="flightLogsDropdown">
                    <button class="nav-link py-2 md:py-0 flex items-center gap-1 bg-transparent border-none cursor-pointer" onclick="toggleDropdown(event)">
                        Flight Logs
                        <span class="dropdown-arrow" id="dropdownArrow">▼</span>
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="/archive/" class="dropdown-item">// Flight Logs</a>
                        <a href="/archive/selector.html" class="dropdown-item">// Selector</a>
                        <a href="/archive/gallery.html" class="dropdown-item">// Gallery</a>
                    </div>
                </div>
                <a href="/0x6C6F6C/" class="nav-link py-2 md:py-0">0x6C6F6C</a>
                <a href="/contact/" class="nav-link py-2 md:py-0">Contact</a>
                
                <div class="md:hidden mt-8 text-xs text-muted mono space-y-1">
                    <p>// OUIRISE NAV</p>
                    <p>// v2.8.0</p>
                </div>
            </nav>
        </div>
    </header>

    <!-- Error Content -->
    <div class="error-body pt-16">
        <div class="error-container">
            <div class="est-line">// EST. 2025 // CLT // ERROR</div>
            
            <div class="error-code">404</div>
            
            <div class="error-box">
                <h1 class="error-title">Access Denied</h1>
                <p class="error-message">
                    The resource you requested does not exist in our archives.<br>
                    Check your coordinates and try again.
                </p>
                <a href="/" class="home-link">Return to Base</a>
            </div>
            
            <div class="mono text-xs text-[#666666] mt-8">
                <p>俊达 // NO EXTRACTION // ALLWAYS</p>
            </div>
        </div>
    </div>

    <script>
        // Dropdown toggle functionality
        function toggleDropdown(e) {
            e.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            const arrow = document.getElementById('dropdownArrow');
            const isOpen = menu.classList.contains('open');
            
            // Close all other dropdowns first
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
            document.querySelectorAll('.dropdown-arrow').forEach(a => a.classList.remove('open'));
            
            // Toggle current
            if (!isOpen) {
                menu.classList.add('open');
                arrow.classList.add('open');
            }
        }
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('flightLogsDropdown');
            if (!dropdown.contains(e.target)) {
                document.getElementById('dropdownMenu').classList.remove('open');
                document.getElementById('dropdownArrow').classList.remove('open');
            }
        });
        
        // Desktop hover behavior
        if (window.matchMedia('(min-width: 768px)').matches) {
            const dropdown = document.getElementById('flightLogsDropdown');
            const menu = document.getElementById('dropdownMenu');
            const arrow = document.getElementById('dropdownArrow');
            
            dropdown.addEventListener('mouseenter', () => {
                menu.classList.add('open');
                arrow.classList.add('open');
            });
            
            dropdown.addEventListener('mouseleave', () => {
                menu.classList.remove('open');
                arrow.classList.remove('open');
            });
        }
    </script>
</body>
</html>
