<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUNDA API // DataBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="../junda-components.css">
  <style>
    body {
      min-height: 100vh;
      background: var(--void);
      padding: 48px 24px;
    }
    
    .api-container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .api-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--surface);
    }
    
    .api-title {
      font-family: var(--font-header);
      font-size: 32px;
      letter-spacing: 3px;
      color: var(--signal);
    }
    
    .api-title::before {
      content: '// ';
      color: var(--bright-maroon);
    }
    
    .api-back {
      color: var(--ghost);
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .api-back:hover {
      color: var(--signal);
    }
    
    /* Markdown styles */
    .api-content h1 {
      font-family: var(--font-header);
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--signal);
      margin: 32px 0 16px;
    }
    
    .api-content h2 {
      font-family: var(--font-header);
      font-size: 20px;
      letter-spacing: 1px;
      color: var(--bright-maroon);
      margin: 24px 0 12px;
    }
    
    .api-content h3 {
      font-size: 14px;
      color: var(--signal);
      margin: 20px 0 10px;
    }
    
    .api-content p {
      color: var(--ghost);
      line-height: 1.7;
      margin-bottom: 16px;
    }
    
    .api-content code {
      background: var(--tactical);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--bright-maroon);
    }
    
    .api-content pre {
      background: var(--tactical);
      border: 1px solid var(--surface);
      border-radius: 4px;
      padding: 16px;
      overflow-x: auto;
      margin: 16px 0;
    }
    
    .api-content pre code {
      background: none;
      padding: 0;
      color: var(--signal);
    }
    
    .api-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    
    .api-content th,
    .api-content td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid var(--surface);
    }
    
    .api-content th {
      color: var(--signal);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
    }
    
    .api-content td {
      color: var(--ghost);
      font-size: 13px;
    }
    
    .api-content hr {
      border: none;
      border-top: 1px solid var(--surface);
      margin: 32px 0;
    }
    
    .api-content a {
      color: var(--bright-maroon);
      text-decoration: none;
    }
    
    .api-content a:hover {
      color: var(--signal);
      text-decoration: underline;
    }
    
    .api-content ul,
    .api-content ol {
      margin: 16px 0;
      padding-left: 24px;
    }
    
    .api-content li {
      color: var(--ghost);
      margin-bottom: 8px;
      line-height: 1.6;
    }
    
    .api-footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--surface);
      text-align: center;
      color: var(--ghost);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="api-container">
    <header class="api-header">
      <div class="api-title">JUNDA API</div>
      <a href="/" class="api-back">← Back to Site</a>
    </header>
    
    <main class="api-content" data-md="index.md">
      <!-- Markdown content loads here -->
    </main>
    
    <footer class="api-footer">
      🌫️🌒 俊达 // DataBridge v6.7.0
    </footer>
  </div>
  
  <script src="../global.js"></script>
</body>
</html>
